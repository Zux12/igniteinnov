<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>IgniteInno Visitor Analytics</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f9;
      color: #172033;
    }

    .header {
      background: #0b0f17;
      color: #ffffff;
      padding: 22px;
    }

    .header-inner {
      width: min(1400px, 94%);
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 5px 0 0;
      color: #cbd5e1;
    }

    .container {
      width: min(1400px, 94%);
      margin: 28px auto;
    }

    .login-card,
    .panel {
      background: #ffffff;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.07);
    }

    .login-card {
      max-width: 480px;
      margin: 60px auto;
    }

    .login-card h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      background: #0b0f17;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .login-card button {
      width: 100%;
      margin-top: 12px;
    }

    .error {
      color: #b42318;
      margin-top: 12px;
    }

    .dashboard {
      display: none;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .card span {
      display: block;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .card strong {
      font-size: 30px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .toolbar input {
      max-width: 430px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1300px;
    }

    th,
    td {
      text-align: left;
      padding: 11px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 13px;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
      position: sticky;
      top: 0;
    }

    .event {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 9px;
      background: #eef2ff;
      font-size: 12px;
      font-weight: 700;
    }

    .muted {
      color: #64748b;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 520px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div>
      <h1>IgniteInno Visitor Analytics</h1>
      <p>Website visitor activity dashboard</p>
    </div>

    <button
      id="logoutButton"
      type="button"
      style="display:none"
    >
      Log Out
    </button>
  </div>
</header>

<main class="container">

  <section id="loginSection" class="login-card">
    <h2>Administrator Access</h2>

    <p class="muted">
      Enter the Ignite visitor analytics password.
    </p>

    <input
      id="adminPassword"
      type="password"
      placeholder="Administrator password"
      autocomplete="current-password"
    >

    <button id="loginButton" type="button">
      Open Dashboard
    </button>

    <div id="loginError" class="error"></div>
  </section>

  <section id="dashboard" class="dashboard">

    <div class="cards">
      <div class="card">
        <span>Total Records</span>
        <strong id="totalRecords">0</strong>
      </div>

      <div class="card">
        <span>Unique Visitors</span>
        <strong id="uniqueVisitors">0</strong>
      </div>

      <div class="card">
        <span>Page Views</span>
        <strong id="pageViews">0</strong>
      </div>

      <div class="card">
        <span>Recorded Clicks</span>
        <strong id="recordedClicks">0</strong>
      </div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <input
          id="searchInput"
          type="search"
          placeholder="Search visitor, page, device, referrer or click"
        >

        <button id="refreshButton" type="button">
          Refresh Records
        </button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date and Time</th>
              <th>Event</th>
              <th>Visitor</th>
              <th>Page</th>
              <th>Device</th>
              <th>Referrer</th>
              <th>Language</th>
              <th>Screen</th>
              <th>Timezone</th>
              <th>Duration</th>
              <th>Clicked Element</th>
            </tr>
          </thead>

          <tbody id="visitorTableBody"></tbody>
        </table>
      </div>
    </div>

  </section>

</main>

<script>
  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzJzI8TvsjnYVvLXZW49wpJJaaGhakDQPdtTBw6IRaeJ8z0N5slDuirPoZF4Ky6KFZ8nw/exec";

  const loginSection = document.getElementById("loginSection");
  const dashboard = document.getElementById("dashboard");
  const loginButton = document.getElementById("loginButton");
  const logoutButton = document.getElementById("logoutButton");
  const refreshButton = document.getElementById("refreshButton");
  const adminPasswordInput =
    document.getElementById("adminPassword");
  const loginError = document.getElementById("loginError");
  const searchInput = document.getElementById("searchInput");
  const visitorTableBody =
    document.getElementById("visitorTableBody");

  let visitorRecords = [];
  let currentPassword = "";

  function escapeHtml(value) {
    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatDate(value) {
    if (!value) return "-";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return String(value);
    }

    return date.toLocaleString();
  }

  function updateSummary(records) {
    document.getElementById("totalRecords").textContent =
      records.length;

    const uniqueVisitorIds = new Set(
      records
        .map(function (record) {
          return record.visitorId;
        })
        .filter(Boolean)
    );

    document.getElementById("uniqueVisitors").textContent =
      uniqueVisitorIds.size;

    document.getElementById("pageViews").textContent =
      records.filter(function (record) {
        return record.eventType === "page_view";
      }).length;

    document.getElementById("recordedClicks").textContent =
      records.filter(function (record) {
        return record.eventType === "click";
      }).length;
  }

  function renderTable(records) {
    if (!records.length) {
      visitorTableBody.innerHTML = `
        <tr>
          <td colspan="11">
            No visitor records found.
          </td>
        </tr>
      `;
      return;
    }

    visitorTableBody.innerHTML = records
      .map(function (record) {
        return `
          <tr>
            <td>${escapeHtml(formatDate(record.timestamp))}</td>

            <td>
              <span class="event">
                ${escapeHtml(record.eventType)}
              </span>
            </td>

            <td>
              ${escapeHtml(record.visitorId)}
            </td>

            <td>
              <strong>${escapeHtml(record.page)}</strong><br>
              <span class="muted">
                ${escapeHtml(record.pageTitle)}
              </span>
            </td>

            <td>
              <strong>${escapeHtml(record.device)}</strong><br>
              <span class="muted">
                ${escapeHtml(record.browserDetails)}
              </span>
            </td>

            <td>${escapeHtml(record.referrer)}</td>
            <td>${escapeHtml(record.language)}</td>
            <td>${escapeHtml(record.screenSize)}</td>
            <td>${escapeHtml(record.timezone)}</td>

            <td>
              ${
                record.durationSeconds
                  ? escapeHtml(record.durationSeconds) + " seconds"
                  : "-"
              }
            </td>

            <td>${escapeHtml(record.clickedElement)}</td>
          </tr>
        `;
      })
      .join("");
  }

  function loadRecordsWithJsonp(password) {
    return new Promise(function (resolve, reject) {
      const callbackName =
        "igniteVisitorCallback_" +
        Date.now() +
        "_" +
        Math.random().toString(36).slice(2);

      const script = document.createElement("script");

      const timeout = setTimeout(function () {
        cleanup();
        reject(new Error("The request timed out."));
      }, 15000);

      function cleanup() {
        clearTimeout(timeout);

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        try {
          delete window[callbackName];
        } catch (error) {
          window[callbackName] = undefined;
        }
      }

      window[callbackName] = function (data) {
        cleanup();

        if (!data || data.success !== true) {
          reject(
            new Error(
              data && data.message
                ? data.message
                : "Unable to load visitor records."
            )
          );
          return;
        }

        resolve(data.records || []);
      };

      const query =
        "?action=list" +
        "&password=" +
        encodeURIComponent(password) +
        "&callback=" +
        encodeURIComponent(callbackName) +
        "&t=" +
        Date.now();

      script.src = APPS_SCRIPT_URL + query;

      script.onerror = function () {
        cleanup();
        reject(new Error("Unable to contact the analytics service."));
      };

      document.body.appendChild(script);
    });
  }

  async function loadVisitorRecords() {
    visitorRecords =
      await loadRecordsWithJsonp(currentPassword);

    updateSummary(visitorRecords);
    renderTable(visitorRecords);
  }

  loginButton.addEventListener("click", async function () {
    const suppliedPassword =
      adminPasswordInput.value.trim();

    if (!suppliedPassword) {
      loginError.textContent =
        "Please enter the administrator password.";
      return;
    }

    currentPassword = suppliedPassword;
    loginError.textContent = "";
    loginButton.disabled = true;
    loginButton.textContent = "Opening...";

    try {
      await loadVisitorRecords();

      loginSection.style.display = "none";
      dashboard.style.display = "block";
      logoutButton.style.display = "inline-block";
    } catch (error) {
      currentPassword = "";
      loginError.textContent =
        error.message === "Unauthorized."
          ? "Incorrect administrator password."
          : "The visitor records could not be loaded.";
    } finally {
      loginButton.disabled = false;
      loginButton.textContent = "Open Dashboard";
    }
  });

  adminPasswordInput.addEventListener(
    "keydown",
    function (event) {
      if (event.key === "Enter") {
        loginButton.click();
      }
    }
  );

  refreshButton.addEventListener("click", async function () {
    refreshButton.disabled = true;
    refreshButton.textContent = "Refreshing...";

    try {
      await loadVisitorRecords();
    } catch (error) {
      alert("The visitor records could not be refreshed.");
    } finally {
      refreshButton.disabled = false;
      refreshButton.textContent = "Refresh Records";
    }
  });

  logoutButton.addEventListener("click", function () {
    currentPassword = "";
    visitorRecords = [];
    adminPasswordInput.value = "";

    dashboard.style.display = "none";
    loginSection.style.display = "block";
    logoutButton.style.display = "none";
  });

  searchInput.addEventListener("input", function () {
    const searchText = searchInput.value
      .trim()
      .toLowerCase();

    if (!searchText) {
      renderTable(visitorRecords);
      return;
    }

    const filteredRecords = visitorRecords.filter(
      function (record) {
        return Object.values(record).some(function (value) {
          return String(value || "")
            .toLowerCase()
            .includes(searchText);
        });
      }
    );

    renderTable(filteredRecords);
  });
</script>

</body>
</html>
